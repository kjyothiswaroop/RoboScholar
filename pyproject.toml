[project]
name = "roboscolar"
version = "0.1.0"
description = "Robotics paper Q&A with a from-scratch transformer and RAG"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0,<2.0",
    "matplotlib>=3.8.0",
    "wandb>=0.16.0",
    "hydra-core>=1.3.0",
    "tokenizers>=0.15.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "arxiv>=2.0.0",
    "arxivscraper>=0.0.4",
    "requests>=2.32.0",
    "anthropic>=0.18.0",
    "ollama>=0.3.0",
    "mcp>=1.0.0",
    "tqdm>=4.65.0",
    "plotly>=5.17.0",
    "rouge-score>=0.1.2",
    "PyMuPDF>=1.23.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
    "pytest>=8.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py310"
